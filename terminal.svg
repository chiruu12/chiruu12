  </pattern>
</defs>
<style>
  text { font-family: ui-monospace, 'Cascadia Code', 'SF Mono', 'Fira Code', Consolas, monospace; font-size: 13px; }
  .line { opacity: 0; animation: appear 0.01s forwards; }
  @keyframes appear { to { opacity: 1; } }
  @keyframes blink { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }
  .cursor { animation: blink 1s step-end infinite; }
  @keyframes glow {
    0%, 100% { filter: drop-shadow(0 0 2px rgba(181,232,83,0.3)); }
    50% { filter: drop-shadow(0 0 6px rgba(181,232,83,0.6)); }
  }
  .terminal-text { animation: glow 4s ease-in-out infinite; }
</style>
