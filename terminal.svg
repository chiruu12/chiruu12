<svg xmlns="http://www.w3.org/2000/svg" width="680" height="528" viewBox="0 0 680 528">
<defs>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#0a0a0a"/>
